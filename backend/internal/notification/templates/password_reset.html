<!DOCTYPE html>
<html>
<body style="margin:0;padding:24px;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#18181b;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;">
    <tr>
      <td style="padding:32px;">
        <h1 style="margin:0 0 16px;font-size:20px;">Reset your password</h1>
        <p style="margin:0 0 16px;line-height:1.5;">Hi {{.FirstName}},</p>
        <p style="margin:0 0 24px;line-height:1.5;">Someone asked to reset the password for your account. The link works once, for the next hour.</p>
        <p style="margin:0 0 24px;"><a href="{{.Link}}" style="display:inline-block;padding:12px 20px;background:#18181b;color:#ffffff;border-radius:6px;text-decoration:none;font-weight:bold;">Choose a new password</a></p>
        <p style="margin:0;line-height:1.5;">If you didn't ask for this, you can ignore this email. Your password stays the same.</p>
      </td>
    </tr>
  </table>
</body>
</html>
