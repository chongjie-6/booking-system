# Local Postgres, Redis, Kafka and Kafka Connect (Debezium) for the backend: `docker compose up -d`.
# Matching settings: DATABASE_URL=postgres://booking:booking@localhost:5432/booking, REDIS_ADDRESS=localhost:6379, KAFKA_ADDRESS=localhost:9092
# Kafka Connect's REST API is on localhost:8083.
services:
  postgres:
    image: postgres:18
    # Logical WAL lets Debezium read changes. The cap stops a stopped connector's replication slot from filling the disk;
    # past it Postgres drops the slot and the connector has to be recreated.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=10GB"]
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql]

  redis:
    image: redis:8
    ports: ["6379:6379"]

  # Single-node KRaft broker that creates topics on first use. It advertises localhost:9092 to the host and kafka:29092
  # to other containers. Setting any KAFKA_ var replaces the image's defaults, so the full config is here.
  kafka:
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  # Kafka Connect with Debezium, which sends outbox rows to Kafka. It starts with no connectors, and Kafka has no volume,
  # so register the outbox connector after each `up` that recreates Kafka (safe to re-run):
  #   curl -X PUT -H "Content-Type: application/json" --data @debezium/outbox.json localhost:8083/connectors/outbox/config
  connect:
    image: quay.io/debezium/connect:3.3
    ports: ["8083:8083"]
    depends_on: [postgres, kafka]
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses

volumes:
  postgres:
