# Local Postgres, Redis, Kafka and Kafka Connect (Debezium) for the backend: `docker compose up -d`.
# Matching settings: DATABASE_URL=postgres://booking:booking@localhost:5432/booking, REDIS_ADDRESS=localhost:6379, KAFKA_ADDRESS=localhost:9092
# Kafka Connect's REST API is on localhost:8083.
services:
  postgres:
    image: postgres:18
    # Logical WAL lets Debezium read changes. The cap stops a stopped connector's replication slot from filling the disk;
    # past it Postgres drops the slot and the connector has to be recreated.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=10GB"]
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "booking"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:8
    ports: ["6379:6379"]

  # Single-node KRaft broker that creates topics on first use. It advertises localhost:9092 to the host and kafka:29092
  # to other containers. Setting any KAFKA_ var replaces the image's defaults, so the full config is here.
  kafka:
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  # Kafka Connect with Debezium, which sends outbox rows to Kafka. It starts with no connectors, and Kafka has no volume,
  # so connect-init registers the outbox connector on every `up`.
  connect:
    image: quay.io/debezium/connect:3.3
    ports: ["8083:8083"]
    depends_on: [postgres, kafka]
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses

  # Registers (or updates) the outbox connector, then waits for its task to run, restarting it while it fails: it fails
  # until the backend's migrations have made the outbox table. Exits once it runs; `docker compose logs connect-init`.
  connect-init:
    image: curlimages/curl:8.17.0
    depends_on: [connect]
    volumes: ["./debezium/outbox.json:/outbox.json:ro"]
    entrypoint: ["sh", "-c"]
    command:
      - |
        api=http://connect:8083/connectors/outbox
        until curl -fsS -o /dev/null -X PUT -H "Content-Type: application/json" --data @/outbox.json $$api/config; do
          echo "waiting for Kafka Connect"; sleep 3
        done
        until curl -fsS $$api/status | grep -q '"tasks":\[{"id":0,"state":"RUNNING"'; do
          echo "waiting for the outbox table"; sleep 5
          curl -fsS -o /dev/null -X POST "$$api/restart?includeTasks=true&onlyFailed=true"
        done
        echo "outbox connector running"

  # The app itself, only with `docker compose --profile app up -d --build`; open http://localhost:8081.
  # The backend reads the rest of its settings (JWT_PRIVATE_KEY, TMDB_TOKEN, ...) from backend/.env. Its port isn't
  # published, so every request comes through nginx, which is what makes TRUST_PROXY safe.
  # Restarts if it exits, e.g. when Kafka isn't up yet.
  backend:
    profiles: [app]
    build: backend
    restart: on-failure
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      kafka: { condition: service_started }
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgres://booking:booking@postgres:5432/booking
      REDIS_ADDRESS: redis:6379
      KAFKA_ADDRESS: kafka:29092
      ALLOWED_ORIGINS: http://localhost:8081
      TRUST_PROXY: "true"
    volumes: ["./backend/data:/app/data:ro"]

  # Loads backend/seed.sql on every `up`, once the backend (air or the app profile) has migrated and made the tables.
  # The seed wipes films, screens, showings and bookings; `docker compose logs seed`.
  seed:
    image: postgres:18
    depends_on:
      postgres: { condition: service_healthy }
    volumes: ["./backend/seed.sql:/seed.sql:ro"]
    environment:
      PGHOST: postgres
      PGUSER: booking
      PGPASSWORD: booking
      PGDATABASE: booking
    entrypoint: ["sh", "-c"]
    command:
      - |
        until psql -qc 'SELECT 1 FROM events LIMIT 0' >/dev/null 2>&1; do echo "waiting for migrations"; sleep 2; done
        psql -v ON_ERROR_STOP=1 -f /seed.sql

  frontend:
    profiles: [app]
    build: frontend
    depends_on: [backend]
    ports: ["8081:80"]

volumes:
  postgres:
