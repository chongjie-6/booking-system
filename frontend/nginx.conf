# Serves the built app and forwards API paths to the backend, like the Vite dev proxy, so the page and API share an
# origin and the auth cookies just work. Add each new API prefix to the location below and to vite.config.ts.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Page loads ask for HTML and get the app, so app URLs like /movies/:slug and /bookings/:ref never reach the API.
    location ~ ^/(auth|user|movies|events|bookings|payments)(/|$) {
        if ($http_accept ~ "text/html") {
            rewrite ^ /index.html last;
        }
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        # Overwrites any X-Real-IP the client sent; the backend trusts it only with TRUST_PROXY=true.
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Vite puts a content hash in asset names, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control immutable;
    }

    location / {
        try_files $uri /index.html;
    }
}
